version: '3.8'

services:
  pg-ssl-db:
    image: postgres:15
    container_name: pg-ssl-db
    environment:
      POSTGRES_DB: langgraph_checkpoints
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./certs:/certs
      - ./init-ssl.sh:/docker-entrypoint-initdb.d/init-ssl.sh
    command: postgres -c 'ssl=on' -c 'ssl_cert_file=/certs/server.crt' -c 'ssl_key_file=/certs/server.key' -c 'ssl_ca_file=/certs/root.crt' -c 'client_cert_auth=on' -c 'hba_file=/certs/pg_hba.conf'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d langgraph_checkpoints"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
